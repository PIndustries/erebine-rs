name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/check_release_version.py
      - run: python3 scripts/check_catalog.py
      - run: python scripts/generate.py
      - run: git diff --exit-code -- src/operations.rs src/api.rs
      - run: cargo fmt --check
      - run: cargo check --no-default-features --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --all-features --locked
      - run: cargo doc --no-deps --all-features --locked
      - run: python3 scripts/test_worker_validation.py --sdk rust
