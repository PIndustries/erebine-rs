[package]
name = "erebine-rs"
version = "26.10.27-build.1"
edition = "2021"
description = "Community native Rust SDK for Erebine inference and platform APIs"
license = "MIT"
repository = "https://github.com/PIndustries/erebine-rs"
readme = "README.md"
keywords = ["erebine", "sdk", "llm", "streaming"]
categories = ["api-bindings", "asynchronous"]
exclude = ["work", "target"]

[lib]
name = "erebine"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures-core = "0.3"
futures-util = "0.3"
async-stream = "0.3"

[dev-dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[features]
default = []
realtime = ["dep:tokio-tungstenite", "dep:tokio", "dep:base64"]

[dependencies.tokio-tungstenite]
version = "0.28"
optional = true
default-features = false
features = ["connect", "rustls-tls-webpki-roots"]

[dependencies.tokio]
version = "1"
optional = true
features = ["net", "time"]

[dependencies.base64]
version = "0.22"
optional = true
